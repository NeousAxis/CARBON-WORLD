name: CARBON WORLD Pipeline

on:
  # Schedule disabled 2026-04-17: pipeline now runs on Hetzner VPS (cron 15min).
  # Kept workflow_dispatch as emergency fallback only.
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('worker/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run pipeline
        working-directory: worker
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3-32b
          MAX_ARTICLES_PER_RUN: '50'
          MIN_HOURS_BETWEEN_RUNS: '0'
          SOLANA_KEYPAIR: ${{ secrets.SOLANA_KEYPAIR }}
          SOLANA_NETWORK: mainnet
        run: |
          # Write Solana keypair to temp file for the executor
          mkdir -p ~/.config/solana
          echo "$SOLANA_KEYPAIR" > ~/.config/solana/cbwd.json

          # Run the pipeline (--force to ignore last_run check)
          python main.py --force

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/export.json web/data/export.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: auto-update export.json from pipeline run"
            git push
          fi
