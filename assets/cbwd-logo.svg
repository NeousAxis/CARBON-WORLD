<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9B2E"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#111111"/>
  <!-- Abstract carbon cycle: two arcs forming a dynamic C shape -->
  <!-- Outer arc -->
  <path d="M 360 128 A 160 160 0 1 0 360 384"
        fill="none" stroke="url(#glow)" stroke-width="40" stroke-linecap="round"/>
  <!-- Inner arc (smaller, offset, representing the cycle) -->
  <path d="M 310 178 A 100 100 0 1 1 310 334"
        fill="none" stroke="#FF8400" stroke-width="24" stroke-linecap="round" opacity="0.6"/>
  <!-- Center dot (carbon atom) -->
  <circle cx="256" cy="256" r="20" fill="#FF8400"/>
  <!-- Three orbital dots -->
  <circle cx="256" cy="170" r="8" fill="#FF8400" opacity="0.8"/>
  <circle cx="182" cy="306" r="8" fill="#FF8400" opacity="0.8"/>
  <circle cx="330" cy="306" r="8" fill="#FF8400" opacity="0.8"/>
</svg>
